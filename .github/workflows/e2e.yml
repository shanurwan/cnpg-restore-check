name: e2e
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CERT_MANAGER_VERSION: v1.19.1
  CNPG_VERSION: "1.30.1"
  PLUGIN_VERSION: v0.16.0
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          cluster_name: e2e
      - name: Install cert-manager, CloudNativePG and plugin-barman-cloud
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml
          kubectl -n cert-manager rollout status deploy --timeout=5m
          kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v${CNPG_VERSION}/cnpg-${CNPG_VERSION}.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=5m
          kubectl apply -f https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/${PLUGIN_VERSION}/manifest.yaml
          kubectl -n cnpg-system rollout status deploy/barman-cloud --timeout=5m
      - name: Build and install the controller
        run: |
          docker build -t cnpg-restore-check:e2e .
          kind load docker-image cnpg-restore-check:e2e --name e2e
          helm install cnpg-restore-check charts/cnpg-restore-check -n cnpg-restore-check --create-namespace \
            --set image.repository=cnpg-restore-check --set image.tag=e2e --set image.pullPolicy=Never --wait
      - run: make e2e
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n cnpg-restore-check logs deploy/cnpg-restore-check --tail=300 || true
          kubectl get restorechecks,clusters.postgresql.cnpg.io,backups.postgresql.cnpg.io,pods,jobs -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
