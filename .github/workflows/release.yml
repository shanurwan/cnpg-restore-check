name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Package and push the chart
        run: |
          v=${{ steps.v.outputs.version }}
          sed -i "s/^version: .*/version: $v/; s/^appVersion: .*/appVersion: \"$v\"/" charts/cnpg-restore-check/Chart.yaml
          helm package charts/cnpg-restore-check -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/cnpg-restore-check-$v.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          make install-yaml
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/install.yaml
          generate_release_notes: true
