{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crc.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crc.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# Rules are generated from the controller's RBAC markers (make manifests).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crc.fullname" . }}
  labels:
    {{- include "crc.labels" . | nindent 4 }}
rules:
  {{- .Files.Get "files/rules.yaml" | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crc.fullname" . }}
  labels:
    {{- include "crc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "crc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "crc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "crc.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crc.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "crc.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "crc.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "crc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
